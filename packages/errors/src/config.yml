# ##############################
# Configuration for mct-errors
# ##############################

# If you want to make modpack-related config, copy and modify this one
# and feed it to mct-errors with argument

# `boundaries`, `match`, `replace.from` and `groupBy` are JS RegExes.
# `ignore` has its own, simpler syntax — see the note above it.

# ##############################

# We can cut only partial of log if we dont want to list all the errors
boundaries:
  from:
  to: '\[Server thread|\[Server Pinger' # Server thread started when player joining world

# RegEx to match log. Matches all Warnings and Errors in debug.log.
# Fragments are concatenated with no separator (joined source must be a valid JS RegExp).
match:
  # VintageFix multi-line "Posting dynamic ModelBakeEvent" timing block
  - '(?:^\[\d+:\d+:\d+\] \[[^\]]+WARN\] \[VintageFix\]: Posting dynamic ModelBakeEvent[^\n]*\r?\n(?:\[\d+:\d+:\d+\] \[[^\]]+WARN\] \[VintageFix\]: [^\n]*\r?\n)*)'
  # Optional mixin TRACE Catching block that precedes a WARN/ERROR
  - '|(?:^\[\d+:\d+:\d+\] \[[^\]]+TRACE\] \[mixin\]: Catching\r?\n(?:(?!\[).*\r?\n)*)?'
  # Start of any WARN/ERROR line — captures group \1 (prefix) and group \2 (FML tag, set inside the alternation below)
  - '^(\[\d+:\d+:\d+\] \[[^\]]+(?:WARN|ERROR)\])'
  # Multi-line FML ingredient errors framed by lines of forty asterisks
  - '(?:( \[FML\]: )\*{40}\r?\n(\1\2\*\s+.*\r?\n)+\1\2\*{40}\r?\n'
  # Or normal single/multi-line errors (continuation lines that don''t start with `[`)
  - '|([\s\S\n](?!^\[))+'
  # Optional trailing ASM "Index: N Listeners:" block that follows some errors
  - '(\r?\n\[\d+:\d+:\d+\] \[Client thread\/ERROR\] \[FML\]: Index: \d+ Listeners:\r?\n(\[\d+:\d+:\d+\] \[Client thread\/ERROR\] \[FML\]: \d+: .+\r?\n?)+)?)'

# Before output errors, all this replaces would be applied to resulted element
replace:
  # Remove timestamps
  - from: '^\[\d+:\d+:\d+\] '
    to: ''

  # Remove thread/level/module prefix from continuation lines in multi-line blocks
  - from: '\r?\n\[[^\]/]+/\w+\] \[[^\]]+\]: ?'
    to: "\n"

  # Remove hash codes
  - from: '@[0-9a-f]{4,8}'
    to: '@xxxxxxxx'

  # Remove uuids
  - from: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    to: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

  # Remove other obfuscated names
  - from: \$[a-z]{3}000\$
    to: $xxx000$

  # Cut long stack traces
  - from: '(?<head>(^[^\n]*$\n){5})[\s\S]*\n(?<tail>.+)'
    to: "$<head>  [...]\n$<tail>"

  # Plugin too slow report
  - from: Recipe registry plugin is slow, took .+ ms
    to: Recipe registry plugin is slow, took xxx.x ms

  # Other plugin too slow
  - from: '(Sending runtime to plugin: \S+ took) \d{4} (ms)'
    to: $1 xxxx $2

  # Default slashes to Cleanroom
  - from: '^\[([^\\]+)\\([^\]]+)\]'
    to: '[$1/$2]'

# Gather all errors that include this regex togother and sort them naturally
groupBy:
  - A Recipe Handler has already been registered for this recipe class. com.github.alexthe666.\S+

# Entries to drop from the output.
#
# Each item is a pattern, optionally with nested items under it. Nesting means
# every pattern on the path must appear on the entry's first line, in the order
# written — which is what lets a level and a module name act as headings for
# everything below them. Each item is its own map, so a heading may repeat.
#
# A pattern is literal text in which `*` matches any run of characters within
# one line. Slashes make it a JS RegExp instead: `/@Final field .+ should be/`.
# Quote a pattern containing `: `, otherwise YAML splits it into two.
ignore:
  # FML errors that most mods have, no harm
  - FML:
      - The coremod * is not signed!
      - The coremod * does not have a MCVersion annotation
      - /Found .+ should be in a separate jar from the coremod./
      - Potentially Dangerous alternative prefix `*`
      - Mod * is missing the required element 'version'
      # FML mod signature errors
      - The mod * is expecting signature*however there is no signature matching that description
      - /FML appears to be missing any signature data. This is not a good thing/
      # Parsing recipe errors from FML. Probably items just removed but recipe reference is present
      - 'Parsing error loading recipe '
  - /(LaunchWrapper|Foundation)/:
      - Tweak class name * has already been visited
  # Warning about Forge Debug
  - '/: ==( Forge Debug Logging is ENABLED|=+)?/'
  # PetroPetunia cant be tweaked with decay https://github.com/quat1024/BotaniaTweaks/issues/63
  - /Mod floralchemy is loaded. but flower petropetunia is not present??/
  # Some case-sensetive warnings, can be ignored
  - '/WARN. \[.+AbstractResourcePack\]: ResourcePack: ignored non-lowercase namespace: META-INF in/'
  # Player error, not modpack one
  - Failed to load bookmarked ItemStack from json string, the item no longer exists
  # Nutrition cant attach capabilities to Computercraft and Plethora. Doesnt matter since turtles cant eat anyway
  - /Exception caught during firing event \S+AttachCapabilitiesEvent[\s\S]+nutrition.events.EventPlayerJoinWorld[\s\S]+/
  - 'Unable to read property: material with value: iron for blockstate: *ic2:te'
  # Most likely happens when recipe changed and recipe name was changed too
  - net.minecraft.advancements.AdvancementList:
      - /Couldn.t load advancement/
  # Ignore missing textures (actually, they are unused)
  - net.minecraft.client.renderer.texture.TextureMap:
      - /Using missing texture. unable to load /
  # Warnings that not changing game, just notes
  - CoFH World:
      - Using `metadata` * for blocks is deprecated
  # Guide-API error - mod for JSON books documentation for mods. Unrelated to CraftTweaker
  - Guide-API:
      - Cannot get renderer for recipe type class crafttweaker.mc1120.recipes.MCRecipeShaped
  # Ignore Compact machines disabled recipes
  - compactmachines3:
      - 'Could not deserialize recipe from file:'
  # Warnings that actually a jokes
  - enderio:
      - /TConstruct. you fail again. muhaha! The world is mine. mine!/
      - Applied Energistics conduits loaded. Let your networks connect!
      - OpenComputers conduits loaded. Let your networks connect!
      - Forestry integration loaded. Let things grow.
      - Mekanism Gas conduits loaded. Let your networks connect!
      # Warnings about absent mods
      - Refined Storage conduits NOT loaded. Refined Storage is not installed
      - Could not find Build Craft Wrench definition. Wrench integration with other mods may fail
      - 'Farming Station: Forestry integration for farming loaded but could not find Forestry sapling.'
      - 'Farming Station: Forestry integration for fertilizing loaded but could not find Forestry fertilizer.'
  - placebo:
      - Exception loading patreon data!
  # Probably safe, reported https://github.com/iLexiconn/LLibrary/issues/156
  - LLibrary Core:
      - Failed to fetch hierarchy node for *. This may cause patch issues
      # Safe WARNings, just for information, normal behavior
      - Unable to call Core API! It has not been initialized yet!
  # plethora incompatible with betteranimals
  - /plethora/:
      - /Cannot inject neural renderer for dev.itsmeow.betteranimals/
  # Immersive automatic recycling cant recycle some recipes
  - immersiveengineering:
      - Recipe has invalid inputs and will be ignored
  # IC2 blocks and fluids that skipped
  - /ic2.(Item|Block)/:
      - The * is not initialized.
  # Sledgehammer mod normal behaviour
  - Sledgehammer:
      - Skipping reloadSearchTrees
  - brandonscore:
      - 'No features were detected for mod: brandonscore.'
  - EnderCore ASM:
      - /Ersatz patch applied. things may break!/
  - solcarrot:
      - Invalid Fingerprint!
  - Pack Companion:
      - 'Report deleted from output folder: *'
      - 'Checking config match for Mod Id: *'

  # Errors of loading models, have no effects in game
  - ERROR:
      - FML:
          - /Exception loading (model|blockstate) for( the)? variant/
          - /MultiModel minecraft:builtin.missing is empty/
          - Could not load override model
      # Doesnt change anything in game
      - /(tconstruct-(API|modifier)|conarm)/:
          - /(Could not|Cannot) load (material model|multimodel|modifier-model)/
      # Additional properties for mixins
      - /(mixin|CleanMix)/:
          - Mixin config * does not specify "minVersion" property
          # Reference maps is common mistake of mod developers and does not cause harm
          - 'Invalid REFMAP JSON in :'
      # Some JEI errors, no harm
      - /(jei|Had.?Enough.?Items)/:
          - 'A Recipe Handler has already been registered for '
          - An interpreter is already registered for this item
          - /Recipe has no output. Extra Utilities 2 extrautils2:shortcut_hopper/
          # Reported https://github.com/CleanroomMC/QBitHop/issues/1
          - /Recipe has no output\. Minecraft minecraft:air_0[\s\S]+minecraft:iron_ingot[\s\S]+minecraft:slime_ball[\s\S]+minecraft:chest/
          # Reported https://github.com/Project-RT/RandomTweaker/issues/92
          - 'Found a broken recipe: ink.ikx.rt.impl.mods.jei.recipe.DynamicRecipesWrapper'
      - base:
          - '/java\.io\.FileNotFoundException: biomesoplenty:textures.items.gem\.png/'

  - WARN:
      - FML:
          - '/OBJModel.Parser: found a face .+ with more than 4 vertices/'
          # Actually Additions warning, no harm
          - '/\* Registry Item: The object .+ has been registered twice for the same name/'
          - /A mod has attempted to assign Block Block\{minecraft:air\} to the Fluid/
          - No types have been added to Biome
          - Mod * has been disabled through configuration
          - Unable to find recipe for minecraft:rabbit_stew
          - Unable to find recipe for minecraft:baked_potato
      - Astral Sorcery:
          - Skipped * patreon effects during loading due to malformed data!
      # Mixins for absent mods. Happen when mod doesn't care to check if mod present first
      - /(mixin|CleanMix)/:
          - 'Error loading class: '
          # TileVoidSiphon mixin conflict between thaumictweaker (priority 1000) and thaumicapi (priority 1001) — higher priority wins, harmless skip.
          - '@ModifyConstant conflict. Skipping mixins.thaumictweaker.json:*TileVoidSiphonMixin from mod *->@ModifyConstant::*, already redirected by mixins.thaumicapi.json:*TileVoidSiphonMixin from mod *->@ModifyConstant::*'
          # Technical warnings from the Mixin system about best practices, not critical failures.
          - '@Inject*Shift.BY*exceeds the maximum allowed value'
          - '@Final field * should be final'
          # CleanMix fixes this on its own, mod author only needs to add @Mutable
          - /.+@Accessor.FIELD_SETTER.+ was not marked with @Mutable\. CleanMix has rectified this/
          # Better Biome Blend safe warning that Optifine not installed
          - /Error loading class. net.optifine.CustomColors \(java\.lang\.ClassNotFoundException. The specified class 'net\.optifine\.CustomColors' was not found\)/
          - /@Mixin target net\.optifine\.CustomColors was not found mixins\.betterbiomeblend\.json:MixinCustomColors from mod unknown-owner/
          # Optifine class "Config" missing => no optifine installed
          - /Error loading class. Config .java.lang.ClassNotFoundException. The specified class 'Config' was not found/
          # Leftover refmap name from the FranklyBaubles fork. Reported: https://github.com/Invadermonky/PossiblyBaubles/issues/2
          - /Reference map 'mixins.franklybaubles.refmap.json' for mixins.mixins.possiblybaubles.\S+ could not be read/
          - 'Static binding violation: PRIVATE @Overwrite method func_76615_h in * cannot reduce visibiliy of PUBLIC target method, visibility will be upgraded'
          # Universal Tweaks Warns:
          - /Method overwrite conflict for getRenderBoundingBox in mixins.bugfixes.blocks.banner.json:UTBannerBoundingBoxMixin from mod \w+, previously written by meldexun.renderlib.mixin.MixinTileEntityBanner. Skipping method./
          # Developers usually lazy to add refmaps
          - Reference map '*' for * could not be read. If this is a development environment you can ignore this message
      # REAuth complaining about JAVA version
      - /ReAuth/:
          - /\+-----------------/
          - /\| Please complain /
          - /\| Java 8/
          - /\| Updating would a/
          - /\+-----------------/
          - Cryptography is restricted
          - Certificates required
      # Happens when IC2 machine recipes changed
      - ic2.Recipe:
          - Late recipe loading failed.
      # Forestry using old BoP item entry
      - forestry:
          - 'Missing block: sandstone'
      # Extra Utilities 2 fluids have no block representations
      - tconstruct-API:
          - Itemstack 1xitem.null* cannot represent material * since it is not associated with the material!
          - Replacing material "*" with material from *
      # JED complaining about file fingerprint
      - Sledgehammer:
          - Certificate Fingerprint Violation Detected!
      - justenoughdimensions:
          - /\*{15}/
          - /\*{5}   /
      # Advanced Vector Extensions 512-bit, a specialized instruction set used for high-performance computing
      - curvy_pipes:
          - AVX-512 not available
      # Happens when folders removed manually
      - draconicevolution:
          - Found empty mod doc folder
      # Non-harmful options.txt lines
      - net.minecraft.client.settings.GameSettings:
          - Skipping bad option
      # Texture is not a power-of-two size, causes minor visual shimmer at a distance.
      - net.minecraft.client.renderer.texture.TextureMap:
          - Texture * will have visual artifacts
      # Probably harmless warn, missingno is purple-black checker texture
      - CustomLoadingScreen:
          - /.debug.   - Failed to open stream as class java.io.FileNotFoundException:.*missingno/
      - particleculling:
          - Could not find particle class * If the mod is not installed, this can be ignored
      - enderio:
          - 'Not adding supplied recipe as a recipe already exists for the input: '
          - /Item used in (Smeltery|cast) recipe .+ doesn.t smelt into a fluid/
          - Ender IO core recipe loading has been disabled in the configuration.
          - This is valid, but do NOT report recipe errors to the Ender IO team!
      - /(FML|FTB Library)/:
          - Replacing * with *
      - /inventorytweaks/:
          - 'Failed to check item tree version: null'
      - keywizard:
          - Conflicting mod detected, controls gui override may not work
          - Controls gui override enabled, this may cause problems with other mods
      - smoothfont:
          - Fonts folder "fontfiles" does not exist
          - /renderChar method might be replaced\. Fix the space width to 4 \(MC default\)\./
      - thermalexpansion:
          - Thermal Expansion received an invalid IMC from chisel! Key was addcompactorpressrecipe
      - Chisel:
          - Mod cathedral is using deprecated IMC variation:add! This IMC type may be removed soon, please notify the author of this mod.
      - /toolprogression/:
          - Failed to set tool class of item
      - net.minecraft.client.audio.SoundManager:
          - 'Missing sound for event: thaumcraft:runicshieldcharge'
      - ocsensors:
          - 'Could not find field * in class '
      - /(Had.?Enough.?Items|jei)/:
          - /Recipe registry plugin is slow, took \d{1,3}(\.\d+)? ms\./
      - LoliASM:
          - Profiler has started
          - Stage * profiler has stopped
          - Profiler results for Stage
      - /ModDirector.CORE/:
          - Successfully replaced CA certificates with updated ones!
      - net.minecraft.network.datasync.EntityDataManager:
          - /defineId called for. class .+ from class .+/
      - net.minecraft.client.multiplayer.ClientAdvancementManager:
          - Server informed client about progress for unknown advancement
      - sonarcore:
          - "'WAILA' - unavailable or disabled in config"
      - CrashAssistantJarInJarHelper:
          - /Failed to parse version from mcmod.info of .+/
          - /Closed old CrashAssistantApp process to prevent confusing the player with window containing information from old crash./
      - modularui:
          - Custom cursors are currently not compatible with lwjgl 3. They will be disabled.
      # Reported: https://github.com/Janrupf/mod-director/issues/22
