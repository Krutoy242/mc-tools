          - /Error adding mixin configuration for mixins.integrated_proxy.mod.json/
      - Aqua Acrobatics:
          - Please consider installing MixinBooter to ensure compatibility with more mods
      # "Sledge is a hacky mod. It's entire point is to hack mixins early. So that error is not as much of an error. As it is a warning."
      - /(mixin|CleanMix)/:
          - /Critical problem. mixins.sledgehammer.quark.json:base.module.ModuleLoaderMixin from mod unknown-owner target vazkii.quark.base.module.ModuleLoader was loaded too early./
