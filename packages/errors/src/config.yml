  # ##################
  # Cleanroom Loader errors
  # ##################

  # geeky_kappa (cleanroom maintainer) explanation:
  # "Many mods bundle a copy of Mixin and add MixinTweaker to its manifest. Launchwrapper/Bouncepad don't like to call same tweaker twice. If you have lots of mod doing this that's what you got."
  - WARN:
      - /(Bouncepad|Foundation|Cleanroom)/:
          - /Tweak( class)? name .+Tweaker has already been visited -- skipping/
      # Same story, Cleanroom just loads such coremod itself instead of letting Forge skip it
      - Cleanroom:
          - '* declares both a MixinTweaker TweakClass and FMLCorePlugin.'
          - Added * back to reparseable collection, ready to be identified as a mod.
      - /oshi.util.FileUtil/:
          - /Configuration conflict. there is more than one oshi.properties file on the classpath/
      # Other warnings and errors
      - /(LaunchWrapper|Foundation)/:
          - /.(Bouncepad|Foundation). Uppatched ASM\d+ to ASM9 on class. .+, please port the mod to Cleanroom!/
      - FML:
          - /A mod is using javax classes. .+, please find it out using recaf or similar and report to its mod author./
          # class malfunction, should be harmful but not sure
          - /Couldn't remap class net.minecraft.entity.ai.attributes.AbstractAttributeMap/
          # Mods that included into CR itself
          - The mod with loading plugin * is in blacklist and won't be loaded
      - Foundation:
          - /Exception encountered attempting classloading of .+ java.lang.ClassNotFoundException/
          - Successfully replaced CA certificates with updated ones!
      # Errors even Cleanroom devs doesnt know what means
      - /(mixin|CleanMix)/:
          - Mixin apply for mod UniversalTweaks* from mod UniversalTweaks*::utOverrideOpposingSideCheck with priority 1000 cannot inject into *RenderGlobal
          - /Injection warning. LVT in twilightforest.block.BlockTFMagicLogSpecial::doTreeOfTransformationEffect/
          # Nothirium conflicts
          - /Error loading class. net/malisis/core/renderer/AnimatedRenderer/
          - /Error loading class. net/optifine/DynamicLight/
          - Method overwrite conflict * in mixins.alfheim.json* previously written by meldexun.nothirium*
          - Method overwrite conflict * in mixins.ondemand_sprites.json* previously written by meldexun.nothirium*
          - Method overwrite conflict * in mixins.renderlib.json* previously written by meldexun.nothirium*

  # geeky_kappa says this is harmless
  - has a security seal for path LZMA, but that path is defined and not secure
  # "It's trying to inject itself into coremod, but launchwrapper was broken on codesource"
  - /at snownee.minieffects.core.CoreMod..init..CoreMod.java:26. ~.CoreMod.class:?./
  - can't handle Java 2* class, please * the mod

  # Fixed in later cleanroom versions
  - ERROR:
      - /org.spongepowered.asm.service.mojang.MixinServiceLaunchWrapper/:
          - /MixinBootstrap.doInit.. called during a tweak constructor!/
      - FML:
          - /UUID .+ is being processed with the approach from Java 8 for compatibility's sake. This UUID is malformed!/
